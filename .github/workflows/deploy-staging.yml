name: Deploy staging

# Manda o Dokploy puxar as imagens novas e subir o compose.
# Segredos em Settings → Secrets → Actions:
#   DOKPLOY_URL       https://painel.pulsolab.com.br
#   DOKPLOY_API_KEY   token de Settings → Profile → API/CLI
#   DOKPLOY_COMPOSE_ID  id do compose criado no projeto fila-viva
on:
  workflow_run:
    workflows: [Imagens]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Subir o compose no Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          curl -sS --fail-with-body -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"composeId\":\"$COMPOSE_ID\"}"
