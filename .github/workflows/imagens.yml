name: Imagens

# Constrói as três imagens e publica no ghcr. O deploy no Dokploy vem depois,
# no workflow deploy-staging, que só manda o compose subir a versão nova.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRO: ghcr.io

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        alvo: [api, worker, web]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: apps/${{ matrix.alvo }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ github.repository }}/${{ matrix.alvo }}:latest
            ${{ env.REGISTRO }}/${{ github.repository }}/${{ matrix.alvo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.alvo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.alvo }}
