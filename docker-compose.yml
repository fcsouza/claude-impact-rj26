# Nome fixo: em worktree o diretório muda e o Compose criaria outro projeto,
# com banco vazio e volume órfão.
name: fila-viva

services:
  postgres:
    image: postgres:18-alpine
    profiles: ['local-db']
    environment:
      POSTGRES_USER: filaviva
      POSTGRES_PASSWORD: filaviva
      POSTGRES_DB: filaviva
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U filaviva']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      API_PORT: '3333'
    ports: ['3333:3333']
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: [.env]
    environment:
      API_URL: http://api:3333
    ports: ['3000:3000']
    depends_on: [api]

volumes:
  pgdata:
